<!DOCTYPE html>
<html>

<head>

       <title>NEUROVA</title>

    <style>

        body {
            font-family: Arial;
            background-color: lightgray;
        }

        .product-card {
            background-color: white;
            padding: 20px;
            width: 300px;
            border-radius: 10px;
            margin: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card button {
            background-color: black;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .product-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }

        .navbar {
            background-color: black;
            padding: 15px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 16px;
        }

        .order-form {
            margin-top: 20px;
            padding: 20px;
            background-color: #f7f7f7;
            border-radius: 10px;
        }

        .order-form input,
        .order-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .order-form textarea {
            height: 80px;
            resize: none;
        }

        .order-form button {
            background-color: black;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

       .logo {
    text-align: center;
    font-size: 42px;
    letter-spacing: 6px;
    margin: 25px 0;
    font-weight: bold;

}

      .tagline {
    text-align: center;
    font-size: 18px;
    color: #555;
}

       .section-title {
    text-align: center;
    margin: 30px 0 10px;
    font-size: 28px;
}

    </style>

</head>
<body>



    <div class="navbar">

        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">About</a>
        <a href="#">Contact</a>

    </div>

    <h1 class="logo">NEUROVA</h1>

    <p class="tagline">Discover something you’ll love.</p>

    <h2 class="section-title">Our Products</h2>

<div class="products">

    <div class="product-card">

        <h3>BMW Car</h3>

        <img class="product-image" src="images/car.jfif">

        <p>₹4,00,000</p>

        <button onclick="alert('BMW Car selected!')">Buy Now</button>
           
            <div class="order-form">

    <h3>Place Your Order</h3>

    <input type="text" placeholder="Your Name">

    <input type="tel" placeholder="Phone Number">

    <textarea placeholder="Delivery Address"></textarea>

    <button>Submit Order</button>

</div>

    </div>

    <div class="product-card">

        <h3>Smart Watch</h3>

        <img class="product-image" src="images/watch.jfif">

        <p>₹1,299</p>

         <button onclick="alert('Smart Watch selected!')">Buy Now</button>

    </div>

</div>

       

</body>

</html>
