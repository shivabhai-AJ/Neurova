<!DOCTYPE html>
<html>
<head>

    <title>NEUROVA</title>

    <style>

        body {
            font-family: Arial;
            background-color: lightgray;
            margin: 0;
        }

        .navbar {
            background-color: black;
            padding: 15px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 16px;
        }

        .logo {
            text-align: center;
            font-size: 42px;
            letter-spacing: 6px;
            margin: 25px 0;
            font-weight: bold;
        }

        .tagline {
            text-align: center;
            font-size: 18px;
            color: #555;
        }

        .section-title {
            text-align: center;
            margin: 30px 0 10px;
            font-size: 28px;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .product-card {
            background-color: white;
            padding: 20px;
            width: 300px;
            border-radius: 10px;
            margin: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .product-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }

        button {
            background-color: black;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #333;
        }

        .order-form {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background-color: #f7f7f7;
            border-radius: 10px;
        }

        .order-form input,
        .order-form textarea,
        #orderIdInput {

            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;

        }

        .order-form textarea {
            height: 80px;
            resize: none;
        }

        .order-success {
            display: none;
            text-align: center;
            background-color: white;
            padding: 20px;
            margin: 30px auto;
            border-radius: 10px;
            width: 350px;
        }

        .status-check {
            background-color: white;
            max-width: 400px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }

        .status-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #f7f7f7;
            border-radius: 8px;
        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<div class="navbar">

    <a href="#">Home</a>

    <a href="#products">Shop</a>

    <a href="#status">Track Order</a>

</div>


<!-- LOGO -->

<h1 class="logo">NEUROVA</h1>

<p class="tagline">
    Discover something you'll love.
</p>


<!-- PRODUCTS -->

<h2 class="section-title" id="products">
    Our Products
</h2>


<div class="products">


    <!-- BMW TOY CAR -->

    <div class="product-card">

        <h3>BMW Toy Car</h3>

        <img
            class="product-image"
            src="car.jfif"
        >

        <p>₹4,000</p>

        <button onclick="showOrderForm()">
            Buy Now
        </button>


        <div
            class="order-form"
            id="orderForm"
        >

            <h3>Place Your Order</h3>


            <input
                type="text"
                id="bmwName"
                placeholder="Your Name"
            >


            <input
                type="tel"
                id="bmwPhone"
                placeholder="Phone Number"
            >


            <textarea
                id="bmwAddress"
                placeholder="Delivery Address"
            ></textarea>


            <button
                onclick="submitOrder('BMW Toy Car')"
            >
                Submit Order
            </button>

        </div>

    </div>



    <!-- SMART WATCH -->

    <div class="product-card">

        <h3>Smart Watch</h3>

        <img
            class="product-image"
            src="watch.jfif"
        >

        <p>₹1,299</p>

        <button onclick="showWatchForm()">
            Buy Now
        </button>


        <div
            class="order-form"
            id="watchOrderForm"
        >

            <h3>Place Your Order</h3>


            <input
                type="text"
                id="watchName"
                placeholder="Your Name"
            >


            <input
                type="tel"
                id="watchPhone"
                placeholder="Phone Number"
            >


            <textarea
                id="watchAddress"
                placeholder="Delivery Address"
            ></textarea>


            <button
                onclick="submitOrder('Smart Watch')"
            >
                Submit Order
            </button>

        </div>

    </div>

</div>



<!-- SUCCESS MESSAGE -->

<div
    class="order-success"
    id="successMessage"
></div>



<!-- TRACK ORDER -->

<div
    class="status-check"
    id="status"
>

    <h2>Track Your Order</h2>


    <p>
        Enter your Order ID
    </p>


    <input
        type="text"
        id="orderIdInput"
        placeholder="Enter your Order ID"
    >


    <button onclick="checkOrderStatus()">
        Check Status
    </button>


    <div
        class="status-box"
        id="statusResult"
    ></div>

</div>



<!-- FIREBASE -->

<script type="module">


import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getDatabase,
    ref,
    push,
    set,
    get
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";



const firebaseConfig = {

    apiKey:
        "AIzaSyB8ujW3S_3l8DAHfT5rOZaFz5QlI7k0AtM",

    authDomain:
        "neurova-2a935.firebaseapp.com",

    databaseURL:
        "https://neurova-2a935-default-rtdb.firebaseio.com",

    projectId:
        "neurova-2a935",

    storageBucket:
        "neurova-2a935.firebasestorage.app",

    messagingSenderId:
        "8072233485",

    appId:
        "1:8072233485:web:9c6427def8d7abf2ff8b44"

};



const app =
    initializeApp(firebaseConfig);


const database =
    getDatabase(app);



/* BMW FORM */

window.showOrderForm = function() {

    document.getElementById(
        "orderForm"
    ).style.display = "block";

};



/* WATCH FORM */

window.showWatchForm = function() {

    document.getElementById(
        "watchOrderForm"
    ).style.display = "block";

};



/* SUBMIT ORDER */

window.submitOrder = function(product) {


    let name;
    let phone;
    let address;


    if (product === "BMW Toy Car") {


        name =
            document.getElementById(
                "bmwName"
            ).value.trim();


        phone =
            document.getElementById(
                "bmwPhone"
            ).value.trim();


        address =
            document.getElementById(
                "bmwAddress"
            ).value.trim();


    } else {


        name =
            document.getElementById(
                "watchName"
            ).value.trim();


        phone =
            document.getElementById(
                "watchPhone"
            ).value.trim();


        address =
            document.getElementById(
                "watchAddress"
            ).value.trim();

    }



    if (
        !name ||
        !phone ||
        !address
    ) {

        alert(
            "Please fill all details!"
        );

        return;

    }



    /* ORDERS DATABASE */

    const ordersRef =
        ref(
            database,
            "orders"
        );


    const newOrderRef =
        push(ordersRef);



    /* SAVE ORDER */

    set(
        newOrderRef,
        {

            product: product,

            name: name,

            phone: phone,

            address: address,

            status: "Pending"

        }

    )

    .then(function() {


        const orderId =
            newOrderRef.key;



        document.getElementById(
            "successMessage"
        ).innerHTML =


            "<h3>🎉 Order Submitted Successfully!</h3>" +


            "<p><b>Product:</b> " +
            product +
            "</p>" +


            "<p><b>Name:</b> " +
            name +
            "</p>" +


            "<p><b>Your Order ID:</b></p>" +


            "<p><b>" +
            orderId +
            "</b></p>" +


            "<p>Please save this Order ID to track your order.</p>";



        document.getElementById(
            "successMessage"
        ).style.display = "block";



        /* CLEAR FORM */

        if (product === "BMW Toy Car") {

            document.getElementById(
                "bmwName"
            ).value = "";

            document.getElementById(
                "bmwPhone"
            ).value = "";

            document.getElementById(
                "bmwAddress"
            ).value = "";

        } else {

            document.getElementById(
                "watchName"
            ).value = "";

            document.getElementById(
                "watchPhone"
            ).value = "";

            document.getElementById(
                "watchAddress"
            ).value = "";

        }


    })

    .catch(function(error) {

        alert(
            "Error: " +
            error.message
        );

    });

};



/* CHECK ORDER STATUS */

window.checkOrderStatus = function() {


    const orderId =
        document.getElementById(
            "orderIdInput"
        ).value.trim();



    if (!orderId) {

        alert(
            "Please enter your Order ID!"
        );

        return;

    }



    const orderRef =
        ref(
            database,
            "orders/" + orderId
        );



    get(orderRef)

    .then(function(snapshot) {


        const result =
            document.getElementById(
                "statusResult"
            );



        if (snapshot.exists()) {


            const order =
                snapshot.val();



            const currentStatus =
                order.status ||
                "Pending";



            result.innerHTML =


                "<h3>Order Found!</h3>" +


                "<p><b>Product:</b> " +
                order.product +
                "</p>" +


                "<p><b>Status:</b> " +
                currentStatus +
                "</p>";



        } else {


            result.innerHTML =


                "<h3>Order Not Found!</h3>" +


                "<p>Please check your Order ID.</p>";

        }



        result.style.display =
            "block";



    })

    .catch(function(error) {


        alert(
            "Error: " +
            error.message
        );

    });

};


</script>


</body>
</html>
